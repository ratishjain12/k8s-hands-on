apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-04
  namespace: debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "starting worker"
              if [ -z "$DB_HOST" ]; then
                echo "fatal: DB_HOST is not set" >&2
                exit 1
              fi
              sleep 3600
