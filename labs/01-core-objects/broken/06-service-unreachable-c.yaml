apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-06
  namespace: debug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: site-06
  namespace: default
spec:
  selector:
    app: site
  ports:
    - port: 80
      targetPort: 80
