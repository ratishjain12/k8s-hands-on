apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-05
  namespace: debug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: "2"
              memory: 500Gi
