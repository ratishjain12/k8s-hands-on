apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-03
  namespace: debug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: api-03
  namespace: debug
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
