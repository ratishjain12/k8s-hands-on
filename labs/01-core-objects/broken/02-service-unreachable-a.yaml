apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-02
  namespace: debug
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop-02
  namespace: debug
spec:
  selector:
    app: shpo
  ports:
    - port: 80
      targetPort: 80
