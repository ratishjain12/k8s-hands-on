apiVersion: v1
kind: Pod
metadata:
  name: pvc-pod
spec:
  containers:
    - name: pvc-container
      image: busybox
      command:
        [
          "sh",
          "-c",
          "echo Hello from the PVC volume! >> /usr/shared/message.txt && sleep 3600",
        ]
      volumeMounts:
        - name: pvc-volume
          mountPath: /usr/shared
  volumes:
    - name: pvc-volume
      persistentVolumeClaim:
        claimName: lab-pvc
