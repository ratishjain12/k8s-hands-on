apiVersion: v1
kind: Pod
metadata:
  name: emptydir-pod
spec:
  containers:
    - name: emptydir-container-1
      image: busybox
      command:
        [
          "sh",
          "-c",
          "echo Hello from the emptyDir volume! >> /usr/shared/message.txt && sleep 3600",
        ]
      volumeMounts:
        - name: shared-volume
          mountPath: /usr/shared
    - name: emptydir-container-2
      image: busybox
      command: ["sh", "-c", "cat /usr/shared/message.txt && sleep 3600"]
      volumeMounts:
        - name: shared-volume
          mountPath: /usr/shared
  volumes:
    - name: shared-volume
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
