apiVersion: v1
kind: Service
metadata:
  name: store-06
  namespace: debug-02
spec:
  clusterIP: None
  selector:
    app: stores
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store
  namespace: debug-02
spec:
  serviceName: store-06
  replicas: 2
  selector:
    matchLabels:
      app: store
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
        - name: store
          image: busybox:1.36
          command: ["sh", "-c", "hostname > /data/who && sleep 3600"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Mi
