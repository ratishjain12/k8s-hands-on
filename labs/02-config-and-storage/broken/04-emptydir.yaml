apiVersion: v1
kind: Pod
metadata:
  name: pipeline-04
  namespace: debug-02
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /work/out.log; sleep 5; done"]
      volumeMounts:
        - name: scratch
          mountPath: /work
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 5; tail -f /work/out.log"]
      volumeMounts:
        - name: shared
          mountPath: /work
  volumes:
    - name: scratch
      emptyDir: {}
