apiVersion: v1
kind: ConfigMap
metadata:
  name: app-setting
  namespace: debug-02
data:
  LOG_LEVEL: debug
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter-01
  namespace: debug-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporter
  template:
    metadata:
      labels:
        app: reporter
    spec:
      containers:
        - name: reporter
          image: busybox:1.36
          command: ["sh", "-c", "echo log level is $LOG_LEVEL && sleep 3600"]
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-settings
                  key: LOG_LEVEL
