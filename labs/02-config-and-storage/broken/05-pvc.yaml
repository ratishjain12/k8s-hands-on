apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-05
  namespace: debug-02
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: db-05
  namespace: debug-02
spec:
  containers:
    - name: db
      image: busybox:1.36
      command: ["sh", "-c", "echo started >> /data/log && sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data-05
