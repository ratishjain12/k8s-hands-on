apiVersion: v1
kind: Secret
metadata:
  name: tls-03
  namespace: debug-02
type: Opaque
stringData:
  tls.crt: not-a-real-cert
  tls.key: not-a-real-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-03
  namespace: debug-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.25
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            name: tls-03
