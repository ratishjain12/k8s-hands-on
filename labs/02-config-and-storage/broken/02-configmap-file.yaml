apiVersion: v1
kind: ConfigMap
metadata:
  name: site-02
  namespace: debug-02
data:
  index.html: |
    <h1>hello from site-02</h1>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: site-02
  namespace: debug-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: site
  template:
    metadata:
      labels:
        app: site
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: site-02
