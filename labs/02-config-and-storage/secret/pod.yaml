apiVersion: v1
kind: Pod
metadata:
  name: lab-secret-pod
spec:
  containers:
    - name: lab-secret-container
      image: nginx:1.25
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: lab-secret-data
