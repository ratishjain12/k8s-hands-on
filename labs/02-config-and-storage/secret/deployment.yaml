apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-secret-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-secret-app
  template:
    metadata:
      labels:
        app: lab-secret-app
    spec:
      containers:
        - name: lab-secret-container
          image: nginx:1.25
          env:
            - name: SECRET_USERNAME
              valueFrom:
                secretKeyRef:
                  name: lab-secret-data
                  key: username
            - name: SECRET_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-secret-data
                  key: password
          ports:
            - containerPort: 80
